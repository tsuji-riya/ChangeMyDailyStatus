name: Rotate GitHub status
on:
  schedule:
    - cron: '0 15 * * *' # 00:00 JST
  workflow_dispatch:
permissions:
  contents: read
concurrency: rotate-status
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./rotate.sh
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
